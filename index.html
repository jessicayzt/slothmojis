<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slothmojis</title>
<meta name="description" content="Sloth emojis">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f7a45">
<link rel="icon" type="image/png" href="images/slightlysmilingsloth.png">
<link rel="apple-touch-icon" href="images/slightlysmilingsloth.png">
<style>
:root {
  --bark: #6d4c2f; --bark-dark: #4a3220;
  --leaf: #4f7a45; --leaf-dark: #2f4f2a; --leaf-light: #b8d2ab;
  --cream: #f6f1e4; --cream-glass: rgba(246, 241, 228, .9); --card: #fffdf8;
  --ink: #2b3627; --muted: #66755e; --sun: #e9b949; --mark: #ffe9a3;
  --dots: rgba(79, 122, 69, .11); --shadow: 0 2px 8px rgba(61, 44, 24, .12);
  --shadow-hover: 0 8px 18px rgba(61, 44, 24, .2);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bark: #7a5636; --bark-dark: #3b2817;
    --leaf: #6f9a63; --leaf-dark: #bfdcb3; --leaf-light: #3c5236;
    --cream: #171d16; --cream-glass: rgba(23, 29, 22, .9); --card: #212b20;
    --ink: #e7eadf; --muted: #a3ae9b; --sun: #e9b949; --mark: #7a5d12;
    --dots: rgba(169, 201, 154, .08); --shadow: 0 2px 8px rgba(0, 0, 0, .4);
    --shadow-hover: 0 8px 18px rgba(0, 0, 0, .55);
  }
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); background: var(--cream);
  background-image: radial-gradient(circle at 1px 1px, var(--dots) 1px, transparent 0);
  background-size: 22px 22px;
  font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", Quicksand, Comfortaa,
               "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.4;
}
.branch {
  height: 14px;
  background: repeating-linear-gradient(90deg, var(--bark) 0 26px, var(--bark-dark) 26px 32px);
  box-shadow: 0 3px 0 rgba(0, 0, 0, .08);
}
main { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
.hero { display: flex; align-items: center; gap: 18px; padding: 26px 0 8px; }
.hero img {
  width: 84px; height: 84px; flex: none; transform-origin: top center;
  filter: drop-shadow(0 4px 6px rgba(61, 44, 24, .25));
  animation: sway 6s ease-in-out infinite;
}
@keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@media (prefers-reduced-motion: reduce) { .hero img, .spotlight img { animation: none; } .card { transition: none; } }
h1 { margin: 0; font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: .5px; color: var(--leaf-dark); }
.tagline { margin: 4px 0 0; color: var(--muted); }
.controls {
  position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px 16px;
  align-items: center; justify-content: space-between; padding: 12px 0;
  background: var(--cream-glass); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.tabs { display: flex; gap: 8px; }
.tabs button {
  font: inherit; font-weight: 700; font-size: 1rem; padding: 10px 18px; cursor: pointer;
  border: 2px solid var(--leaf); background: var(--card); color: var(--leaf-dark);
  border-radius: 999px 999px 999px 6px; box-shadow: var(--shadow);
}
.tabs button[aria-selected="true"] { background: var(--leaf); color: #fff; }
.tabs button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.tabs .count { margin-left: 6px; font-size: .9em; font-weight: 600; opacity: .85; }
.search { position: relative; flex: none; width: 300px; }
@media (max-width: 640px) {
  .tools { flex: 1 1 100%; }
  .search { flex: 1 1 auto; width: auto; min-width: 0; }
}
@media (max-width: 420px) {
  .random .random-label { display: none; }
  .random { padding: 10px 12px; }
}
.search svg {
  position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
.search input {
  width: 100%; font: inherit; font-size: 1.05rem; padding: 12px 14px 12px 42px;
  border-radius: 999px; border: 2px solid var(--leaf-light); background: var(--card); color: var(--ink);
}
.search input:focus { outline: 3px solid var(--sun); outline-offset: 1px; border-color: var(--leaf); }
.tools { display: flex; flex-wrap: nowrap; align-items: center; gap: 10px; margin-left: auto; }
.random {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; cursor: pointer;
  font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 999px;
  border: 2px solid var(--bark); background: var(--card); color: var(--bark); box-shadow: var(--shadow);
}
.random:hover, .random:focus-visible { background: var(--bark); color: #fff; }
.random:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.random svg { width: 18px; height: 18px; }
.spotlight {
  width: min(92vw, 360px); padding: 30px 24px 22px; text-align: center; color: var(--ink);
  background: var(--card); border: 1px solid var(--leaf-light); border-radius: 16px; box-shadow: var(--shadow-hover);
}
.spotlight::backdrop { background: rgba(31, 46, 28, .55); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.spot-copy {
  display: block; margin: 0 auto 10px; padding: 10px; cursor: pointer; background: transparent;
  border: 1px solid transparent; border-radius: 16px;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.spot-copy:hover, .spot-copy:focus-visible { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--leaf); }
.spot-copy:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.spotlight img { display: block; width: 128px; height: 128px; margin: 0; object-fit: contain; animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.spotlight .name { font-weight: 700; font-size: 1.2rem; color: var(--leaf-dark); overflow-wrap: anywhere; }
.spotlight .aliases { margin-top: 4px; font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
.spotlight-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }
.spotlight-actions button {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 999px;
  border: 2px solid var(--leaf); background: var(--leaf); color: #fff;
}
.spotlight-actions button:hover { background: var(--leaf-dark); border-color: var(--leaf-dark); }
.spotlight-actions svg { width: 18px; height: 18px; }
.spotlight-actions button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.spotlight-close { position: absolute; top: 10px; right: 10px; margin: 0; }
.spotlight-close button {
  width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
  font: inherit; font-size: 1.3rem; line-height: 1; background: transparent; color: var(--muted);
}
.spotlight-close button:hover, .spotlight-close button:focus-visible { background: var(--leaf-light); color: var(--ink); }
.status { margin: 6px 0 14px; min-height: 1.4em; color: var(--muted); }
.status button {
  font: inherit; padding: 0; border: 0; background: none; cursor: pointer;
  color: var(--leaf-dark); text-decoration: underline;
}
.grid {
  list-style: none; margin: 0; padding: 0; display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
.card {
  background: var(--card); border: 1px solid var(--leaf-light); border-radius: 16px;
  padding: 14px 10px 12px; text-align: center; box-shadow: var(--shadow); cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.card:hover, .card:focus-visible {
  transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--leaf);
}
.card:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.card img { display: block; width: 64px; height: 64px; margin: 0 auto 8px; object-fit: contain; }
.card .name { font-weight: 700; font-size: .95rem; color: var(--leaf-dark); overflow-wrap: anywhere; }
.card .aliases { margin-top: 4px; font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 2px; }
.empty { grid-column: 1 / -1; padding: 40px 10px; text-align: center; color: var(--muted); }
.empty img { width: 96px; height: 96px; }
.empty p { margin: 8px 0 0; }
footer { margin-top: 36px; font-size: .9rem; text-align: center; color: var(--muted); }
footer a { color: var(--leaf-dark); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
  padding: 10px 16px; border-radius: 999px; background: var(--bark-dark); color: #fff;
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}
</style>
</head>
<body>
<div class="branch" aria-hidden="true"></div>
<main>
  <header class="hero">
    <img src="images/slightlysmilingsloth.png" alt="" width="84" height="84">
    <div>
      <h1>Slothmojis</h1>
      <p class="tagline">Sloth emojis. Click one to copy its shortcode.</p>
    </div>
  </header>

  <div class="controls">
    <nav class="tabs" role="tablist" aria-label="Emoji groups">
      <button role="tab" id="tab-sloths" data-tab="sloths" aria-selected="true" aria-controls="panel">Sloths<span class="count" id="count-sloths"></span></button>
      <button role="tab" id="tab-bedges" data-tab="bedges" aria-selected="false" aria-controls="panel" tabindex="-1">Bedges<span class="count" id="count-bedges"></span></button>
    </nav>
    <div class="tools">
      <button type="button" id="random" class="random" aria-haspopup="dialog" aria-controls="spotlight" aria-label="Random sloth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"></circle></svg><span class="random-label">Random sloth</span></button>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <label for="q" class="visually-hidden">Search emoji by name or alias</label>
        <input id="q" type="search" placeholder="Search by name or alias" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite">Loading the sloths...</p>
  <section id="panel" role="tabpanel" aria-labelledby="tab-sloths">
    <ul class="grid" id="grid"></ul>
  </section>

  <footer>
    <span id="totals"></span>
    Images and data: <a href="https://github.com/jessicayzt/slothmojis">github.com/jessicayzt/slothmojis</a>
  </footer>
</main>
<dialog id="spotlight" class="spotlight" aria-labelledby="spot-name">
  <form method="dialog" class="spotlight-close"><button type="submit" aria-label="Close">&times;</button></form>
  <button type="button" id="spot-copy" class="spot-copy" aria-label="Copy shortcode">
    <img id="spot-img" src="images/slightlysmilingsloth.png" alt="" width="128" height="128">
  </button>
  <div class="name" id="spot-name"></div>
  <div class="aliases" id="spot-aliases"></div>
  <div class="toast" id="spot-toast" role="status" aria-live="polite"></div>
  <div class="spotlight-actions">
    <button type="button" id="spot-again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"></circle></svg>Roll again</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="search-logic">
// Pure search logic, no DOM. Also run by the Node test against the real JSON.
(function (root) {
  var MIN_FUZZY = 3; // terms shorter than this must appear verbatim
  function normalize(text) {
    return String(text || "").toLowerCase().trim().replace(/^:+|:+$/g, "");
  }
  function terms(query) {
    return normalize(query).split(/\s+/).map(function (t) { return t.replace(/^:+|:+$/g, ""); }).filter(Boolean);
  }
  // One term against one string. kind: 0 exact, 1 prefix, 2 substring, 3 subsequence (the term's
  // characters appear in order with gaps, e.g. "workbedge" in "workfrombedge"; terms of MIN_FUZZY+
  // characters only). positions: matched character indexes, for highlighting.
  function matchText(text, t) {
    var i = text.indexOf(t);
    if (i !== -1) {
      var pos = [];
      for (var k = 0; k < t.length; k++) pos.push(i + k);
      return { kind: text === t ? 0 : (i === 0 ? 1 : 2), positions: pos, span: t.length };
    }
    if (t.length < MIN_FUZZY) return null;
    var positions = [], ti = 0;
    for (var c = 0; c < text.length && ti < t.length; c++) {
      if (text.charAt(c) === t.charAt(ti)) { positions.push(c); ti++; }
    }
    if (ti < t.length) return null;
    return { kind: 3, positions: positions, span: positions[positions.length - 1] - positions[0] + 1 };
  }
  // Rank of a term: name exact 0, name prefix 1, name substring 2, alias exact 3, alias substring 4,
  // name subsequence 5, alias subsequence 6. Lower is better.
  var NAME_RANK = [0, 1, 2, 5];
  var ALIAS_RANK = [3, 4, 4, 6];
  function addAll(set, positions) { for (var i = 0; i < positions.length; i++) set.add(positions[i]); }
  function sorted(set) { return Array.from(set).sort(function (a, b) { return a - b; }); }
  function matchItem(item, qterms) {
    var name = String(item.name).toLowerCase();
    var aliases = item.aliases || [];
    var rank = 0, span = 0;
    var nameMarks = new Set(), aliasMarks = {}, hits = new Set();
    for (var i = 0; i < qterms.length; i++) {
      var t = qterms[i];
      var best = Infinity, bestSpan = Infinity;
      var nm = matchText(name, t);
      if (nm) { best = NAME_RANK[nm.kind]; bestSpan = nm.span; addAll(nameMarks, nm.positions); }
      for (var j = 0; j < aliases.length; j++) {
        var alias = aliases[j];
        var am = matchText(String(alias).toLowerCase(), t);
        if (!am) continue;
        hits.add(alias);
        if (!aliasMarks[alias]) aliasMarks[alias] = new Set();
        addAll(aliasMarks[alias], am.positions);
        var r = ALIAS_RANK[am.kind];
        if (r < best || (r === best && am.span < bestSpan)) { best = r; bestSpan = am.span; }
      }
      if (best === Infinity) return null;
      if (best > rank) rank = best;
      span += bestSpan;
    }
    var marks = {};
    for (var a in aliasMarks) marks[a] = sorted(aliasMarks[a]);
    return { rank: rank, span: span, hits: hits, nameMarks: sorted(nameMarks), aliasMarks: marks };
  }
  // Returns [{item, index, rank, span, hits, nameMarks, aliasMarks}]: best rank first, then the
  // tightest match, then list order. An empty query returns everything in list order.
  function search(items, query) {
    var qterms = terms(query);
    var out = [];
    for (var i = 0; i < items.length; i++) {
      if (!qterms.length) {
        out.push({ item: items[i], index: i, rank: 0, span: 0, hits: new Set(), nameMarks: [], aliasMarks: {} });
        continue;
      }
      var m = matchItem(items[i], qterms);
      if (m) { m.item = items[i]; m.index = i; out.push(m); }
    }
    out.sort(function (a, b) { return a.rank - b.rank || a.span - b.span || a.index - b.index; });
    return out;
  }
  // A random item, never the one named by `exclude` unless it is the only one. `rng` defaults to Math.random.
  function pickRandom(items, exclude, rng) {
    if (!items || !items.length) return null;
    var pool = items.length > 1 ? items.filter(function (it) { return it.name !== exclude; }) : items;
    var r = (rng || Math.random)();
    return pool[Math.min(pool.length - 1, Math.max(0, Math.floor(r * pool.length)))];
  }
  var api = { normalize: normalize, terms: terms, matchText: matchText, search: search, pickRandom: pickRandom };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.Slothmojis = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script id="app">
(function () {
  var S = window.Slothmojis;
  var LABEL = { sloths: "Sloths", bedges: "Bedges" };
  var NOUN = { sloths: ["sloth", "sloths"], bedges: ["bedge", "bedges"] };
  var FILES = { sloths: "sloths.json", bedges: "bedges.json" };
  var els = {
    grid: document.getElementById("grid"),
    status: document.getElementById("status"),
    q: document.getElementById("q"),
    panel: document.getElementById("panel"),
    totals: document.getElementById("totals"),
    toast: document.getElementById("toast"),
    tabs: Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'))
  };
  var state = { tab: "sloths", query: "", data: null };
  var toastTimer = null;

  function esc(text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // Escape text and wrap the characters at `positions` (shifted by `offset`) in <mark>.
  function markText(text, positions, offset) {
    var set = new Set(positions.map(function (p) { return p + offset; }));
    var html = "", open = false;
    for (var i = 0; i < text.length; i++) {
      var on = set.has(i);
      if (on && !open) { html += "<mark>"; open = true; }
      if (!on && open) { html += "</mark>"; open = false; }
      html += esc(text.charAt(i));
    }
    return open ? html + "</mark>" : html;
  }
  function plural(tab, n) { return n === 1 ? NOUN[tab][0] : NOUN[tab][1]; }
  function otherTab(tab) { return tab === "sloths" ? "bedges" : "sloths"; }

  function card(result) {
    var item = result.item;
    var aliases = item.aliases || [];
    var aliasHtml = "";
    if (aliases.length) {
      aliasHtml = '<div class="aliases">aka ' + aliases.map(function (a) {
        return markText(a, result.aliasMarks[a] || [], 0);
      }).join(", ") + "</div>";
    }
    return '<li class="card" tabindex="0" role="button" data-name="' + esc(item.name) + '" ' +
      'aria-label="Copy :' + esc(item.name) + ':">' +
      '<img src="images/' + esc(item.file) + '" alt="" width="64" height="64" loading="lazy" decoding="async">' +
      '<div class="name">' + markText(":" + item.name + ":", result.nameMarks, 1) + "</div>" + aliasHtml + "</li>";
  }

  function render() {
    if (!state.data) return;
    var items = state.data[state.tab];
    var qterms = S.terms(state.query);
    var results = S.search(items, state.query);
    var shown = state.query.trim();
    if (results.length) {
      els.grid.innerHTML = results.map(card).join("");
    } else {
      els.grid.innerHTML = '<li class="empty"><img src="images/confusedsloth.png" alt="" width="96" height="96">' +
        "<p>No " + NOUN[state.tab][1] + " match “" + esc(shown) + "”.</p></li>";
    }
    var text;
    if (!qterms.length) {
      text = results.length + " " + plural(state.tab, results.length);
    } else {
      text = results.length + " " + plural(state.tab, results.length) + " match “" + esc(shown) + "”";
      var other = otherTab(state.tab);
      var otherCount = S.search(state.data[other], state.query).length;
      if (otherCount) {
        text += ' · <button type="button" data-switch="' + other + '">' + otherCount + " " +
          plural(other, otherCount) + " in " + LABEL[other] + "</button>";
      }
    }
    els.status.innerHTML = text;
    els.panel.setAttribute("aria-labelledby", "tab-" + state.tab);
    syncUrl();
  }

  function setTab(tab, focus) {
    if (!LABEL[tab]) return;
    state.tab = tab;
    els.tabs.forEach(function (b) {
      var on = b.dataset.tab === tab;
      b.setAttribute("aria-selected", on ? "true" : "false");
      b.tabIndex = on ? 0 : -1;
      if (on && focus) b.focus();
    });
    render();
  }

  function syncUrl() {
    var q = state.query.trim();
    var url = location.pathname + (q ? "?q=" + encodeURIComponent(q) : "") + "#" + state.tab;
    if (url !== location.pathname + location.search + location.hash) history.replaceState(null, "", url);
  }

  // A fixed toast outside an open modal dialog would sit under its backdrop, so the dialog
  // carries its own toast element and we show whichever one is in view.
  function toast(message) {
    var el = spot.dialog.open ? spot.toast : els.toast;
    els.toast.classList.remove("show");
    spot.toast.classList.remove("show");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1600);
  }
  function copyShortcode(name) {
    var text = ":" + name + ":";
    if (!navigator.clipboard) { toast(text); return; }
    navigator.clipboard.writeText(text).then(function () { toast("Copied " + text); },
      function () { toast(text + " (copying is blocked here)"); });
  }

  els.tabs.forEach(function (b) {
    b.addEventListener("click", function () { setTab(b.dataset.tab, false); });
    b.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); setTab(otherTab(state.tab), true); }
    });
  });
  var debounce = null;
  els.q.addEventListener("input", function () {
    clearTimeout(debounce);
    debounce = setTimeout(function () { state.query = els.q.value; render(); }, 60);
  });
  els.status.addEventListener("click", function (e) {
    var b = e.target.closest("[data-switch]");
    if (b) setTab(b.dataset.switch, false);
  });
  els.grid.addEventListener("click", function (e) {
    var c = e.target.closest(".card");
    if (c) copyShortcode(c.dataset.name);
  });
  els.grid.addEventListener("keydown", function (e) {
    var c = e.target.closest(".card");
    if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); copyShortcode(c.dataset.name); }
  });
  var spot = {
    dialog: document.getElementById("spotlight"),
    img: document.getElementById("spot-img"),
    name: document.getElementById("spot-name"),
    aliases: document.getElementById("spot-aliases"),
    copy: document.getElementById("spot-copy"),
    again: document.getElementById("spot-again"),
    toast: document.getElementById("spot-toast")
  };
  var lastRandom = null;
  function showRandomSloth() {
    if (!state.data) return;
    var item = S.pickRandom(state.data.sloths, lastRandom && lastRandom.name);
    if (!item) return;
    lastRandom = item;
    spot.img.style.animation = "none";
    void spot.img.offsetWidth; // restart the pop animation
    spot.img.style.animation = "";
    spot.img.src = "images/" + item.file;
    spot.name.textContent = ":" + item.name + ":";
    spot.aliases.textContent = item.aliases && item.aliases.length ? "aka " + item.aliases.join(", ") : "";
    spot.copy.dataset.name = item.name;
    spot.copy.setAttribute("aria-label", "Copy :" + item.name + ":");
    if (!spot.dialog.open) {
      if (spot.dialog.showModal) spot.dialog.showModal(); else spot.dialog.setAttribute("open", "");
    }
    spot.again.focus();
  }
  document.getElementById("random").addEventListener("click", showRandomSloth);
  spot.again.addEventListener("click", showRandomSloth);
  spot.copy.addEventListener("click", function () { copyShortcode(spot.copy.dataset.name); });
  window.addEventListener("hashchange", function () {
    var tab = location.hash.replace("#", "");
    if (LABEL[tab] && tab !== state.tab) setTab(tab, false);
  });

  function getJson(file) {
    return fetch(file).then(function (r) {
      if (!r.ok) throw new Error(file + " returned HTTP " + r.status);
      return r.json();
    });
  }
  Promise.all([getJson(FILES.sloths), getJson(FILES.bedges)]).then(function (loaded) {
    state.data = { sloths: loaded[0], bedges: loaded[1] };
    document.getElementById("count-sloths").textContent = loaded[0].length;
    document.getElementById("count-bedges").textContent = loaded[1].length;
    els.totals.textContent = loaded[0].length + " sloths and " + loaded[1].length + " bedges. ";
    var params = new URLSearchParams(location.search);
    state.query = params.get("q") || "";
    els.q.value = state.query;
    var tab = location.hash.replace("#", "");
    setTab(LABEL[tab] ? tab : "sloths", false);
  }).catch(function (err) {
    els.status.textContent = "Could not load the emoji data: " + err.message;
  });
})();
</script>
</body>
</html>
